[package]
name = "xdg-recent-actions"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Expose XBEL recent-file history as freedesktop Desktop Actions"
license = "MIT"
repository = "https://github.com/SteffenBlake/xdg-recent-actions"

[dependencies]
quick-xml = "0.39"
blake3 = "1"
shlex = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
walkdir = "2.5.0"
xdg = "3.0.0"
tempfile = "3"
which = "8.0.6"
freedesktop-desktop-entry = { version = "0.8.4", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
