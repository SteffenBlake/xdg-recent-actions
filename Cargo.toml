[package]
name = "xdg-recent-actions"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Expose XBEL recent-file history as freedesktop Desktop Actions"
license = "MIT"
repository = "https://github.com/SteffenBlake/xdg-recent-actions"

[dependencies]
quick-xml = "0.39"
blake3 = "1"
shlex = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
